server {
    listen 80;
    server_name _;
    root /var/www/backend/public;

    client_max_body_size 20M;

    # Docker DNS: re-resolve "php" so a recreated php container (new IP) doesn't cause 502s
    resolver 127.0.0.11 valid=10s ipv6=off;

    # JSON with Cyrillic text compresses several times over
    gzip on;
    gzip_types application/json application/problem+json;
    gzip_min_length 1024;
    gzip_vary on;

    # Uploads have UUID names, so a URL never changes content: browsers may keep them for a year
    location /uploads/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        # A variable makes nginx resolve the name per request via the resolver above
        set $php_upstream php:9000;
        fastcgi_pass $php_upstream;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }
}
