x-php: &php
  build:
    context: ./docker/php
    target: dev
    args:
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
  volumes:
    - ./backend:/var/www/backend
    # Cache and logs live in a Docker volume so cache:clear never touches the bind mount
    - backend_var:/var/www/backend/var
  # APP_ENV comes from backend/.env (dev); a real env var here would override APP_ENV=test in PHPUnit
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@database:5432/${POSTGRES_DB:-portfolio}?serverVersion=17&charset=utf8
    MESSENGER_TRANSPORT_DSN: amqp://${RABBITMQ_USER:-app}:${RABBITMQ_PASSWORD:-app}@rabbitmq:5672/%2f/messages
    MAILER_DSN: smtp://mailpit:1025
  depends_on:
    database:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  php:
    <<: *php

  worker:
    <<: *php
    command: php bin/console messenger:consume async -vv --time-limit=3600 --memory-limit=256M
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/backend:ro
      # Directory mount: a single-file mount breaks when an editor saves the file as a new inode
      - ./docker/nginx:/etc/nginx/conf.d:ro
    depends_on:
      - php

  # Vue SPA dev server (Vite, hot reload) on http://localhost:5173; proxies /api and /uploads to nginx,
  # so the browser sees one origin and the refresh-token cookie needs no CORS
  frontend:
    image: node:24-alpine
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /app
    command: ["sh", "-c", "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"]
    environment:
      npm_config_cache: /tmp/.npm
      npm_config_update_notifier: "false"
      API_PROXY_TARGET: http://nginx
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    depends_on:
      - nginx

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-app}", "-d", "${POSTGRES_DB:-portfolio}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-app}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-app}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Cache for public API responses. Pure cache: no persistence, items are rebuilt from PostgreSQL.
  # volatile-lru: evicts only items with a TTL, never the tag sets that invalidation relies on.
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"

volumes:
  backend_var:
  db_data:
  rabbitmq_data:
