framework:
    cache:
        # Unique name of your app: used to compute stable namespaces for cache keys.
        prefix_seed: portfolio/backend

        pools:
            # Ready-made JSON of public GET endpoints, invalidated by tags on every relevant
            # database write (PublicApiCacheInvalidator); the TTL is only a safety net.
            cache.public_api:
                adapter: cache.adapter.redis_tag_aware
                provider: '%env(REDIS_URL)%'
                default_lifetime: 3600
